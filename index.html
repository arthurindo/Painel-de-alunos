
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel de Alunos</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Painel de Alunos</h1>
            <p>Demonstração de CRUD Frontend/Backend (Node.js)</p>

            <button
                type="button"
                onclick="window.print()"
                class="btn-pdf">
                ⬇️ Baixar PDF
            </button>
        </header>

        <main>

            <section class="form-section">
                <h2 id="form-titulo">Novo Aluno</h2>

                <form id="aluno-form">

                    <input type="hidden" id="aluno-id">

                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            required
                            placeholder="Ex: João da Silva">
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="Ex: joao@email.com">
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"
                            id="cpf"
                            required
                            maxlength="14"
                            placeholder="Ex: 123.456.789-00">
                    </div>

                    <div class="input-group">
                        <label for="data-nascimento">
                            Data de nascimento
                        </label>

                        <input
                            type="date"
                            id="data-nascimento"
                            name="dataNascimento"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="curso">Curso</label>

                        <select id="curso" required>
                            <option value="">Selecione um curso</option>
                            <option value="Análise de Sistemas">
                                Análise de Sistemas
                            </option>
                            <option value="Engenharia de Software">
                                Engenharia de Software
                            </option>
                            <option value="Ciência da Computação">
                                Ciência da Computação
                            </option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button
                            type="button"
                            class="btn-cancel"
                            id="btn-cancel"
                            style="display: none;">
                            Cancelar edição
                        </button>

                        <button type="submit" class="btn-save">
                            Salvar Aluno
                        </button>
                    </div>

                </form>
            </section>

            <section class="list-section">
                <h2>Alunos Cadastrados</h2>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>CPF</th>
                                <th>Data de Nascimento</th>
                                <th>Curso</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="alunos-tbody">
                            <!-- Os alunos serão inseridos pelo JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

    </div>

    <script src="./script.js"></script>

</body>
</html>
